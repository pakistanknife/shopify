<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Chef Knife Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1814;
      --ecru: #F4EFE5;
      --champagne: #B89968;
      --muted: #888;
      --border: #E0D8CC;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font-family: 'Inter', sans-serif; font-size: 14px; background: var(--ecru); color: var(--ink); min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: #fff; border: 1px solid var(--border); padding: 48px 40px; width: 100%; max-width: 380px; }
    .login-title { font-size: 20px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
    .login-sub { color: var(--champagne); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 32px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .field input { border: 1px solid var(--border); padding: 10px 12px; font-family: inherit; font-size: 14px; color: var(--ink); outline: none; transition: border-color .2s; }
    .field input:focus { border-color: var(--champagne); }
    .btn-primary { width: 100%; padding: 12px; background: var(--ink); color: var(--ecru); border: none; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { background: #2d2a24; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 12px; text-align: center; }

    /* ── Dashboard ── */
    #dashboard { min-height: 100vh; }
    .admin-header { background: var(--ink); color: var(--ecru); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .admin-brand { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .admin-brand span { color: var(--champagne); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .last-refresh { font-size: 11px; color: #777; }
    .btn-sm { padding: 6px 14px; background: transparent; border: 1px solid #444; color: #ccc; font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .btn-sm:hover { border-color: #888; color: #fff; }
    .admin-main { padding: 24px; }

    /* Stats */
    .stats-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #fff; border: 1px solid var(--border); padding: 16px 20px; flex: 1; min-width: 110px; }
    .stat-value { font-size: 28px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--muted); }
    .filter-btn.active { background: var(--ink); color: var(--ecru); border-color: var(--ink); }
    .filter-btn:hover:not(.active) { border-color: var(--ink); color: var(--ink); }
    .refresh-btn { margin-left: auto; padding: 6px 14px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
    .refresh-btn:hover { border-color: var(--champagne); }

    /* Table */
    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f7f4ef; padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #f0ede8; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #faf8f5; }
    tr.is-shipped td { opacity: .5; }
    .date-cell { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .items-cell { max-width: 180px; font-size: 12px; }
    .total-cell { font-weight: 600; white-space: nowrap; }
    .badge { display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 2px; }
    .badge-pending { background: #FFF3CD; color: #856404; }
    .badge-shipped { background: #D1FAE5; color: #065F46; }
    .ship-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .ship-toggle input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--champagne); }
    .btn-print { padding: 5px 12px; background: transparent; border: 1px solid var(--champagne); color: var(--champagne); font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
    .btn-print:hover { background: var(--champagne); color: #fff; }
    .state-msg { padding: 48px; text-align: center; color: var(--muted); }

    /* ── Print ── */
    @media print {
      body > *:not(#print-frame) { display: none !important; }
      #print-frame { display: block !important; }
    }
    #print-frame { display: none; }
  </style>
</head>
<body>

<!-- LOGIN ─────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <p class="login-title">Chef Knife</p>
    <p class="login-sub">Order Management</p>
    <form id="login-form">
      <label class="field">
        <span>Email</span>
        <input type="email" id="login-email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primary">Sign in</button>
      <p id="login-error" class="error-msg" hidden>Invalid credentials.</p>
    </form>
  </div>
</div>

<!-- DASHBOARD ──────────────────────────────── -->
<div id="dashboard" hidden>
  <header class="admin-header">
    <span class="admin-brand">Chef Knife <span>/ Orders</span></span>
    <div class="header-right">
      <span class="last-refresh" id="last-refresh"></span>
      <button class="btn-sm" id="logout-btn">Sign out</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-pending">—</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-shipped">—</div><div class="stat-label">Shipped</div></div>
    </div>

    <div class="toolbar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="shipped">Shipped</button>
      <button class="refresh-btn" id="refresh-btn">↻ Refresh</button>
    </div>

    <div id="orders-container"><div class="state-msg">Loading orders…</div></div>
  </main>
</div>

<!-- PRINT FRAME ────────────────────────────── -->
<div id="print-frame"></div>

<script>
(function () {
  'use strict';
  const API = '/.netlify/functions/admin-orders';
  const ALLOWED = ['kazam.q@gmail.com', 'ayemenqureshi@gmail.com'];

  let token = sessionStorage.getItem('ck_admin') || '';
  let allOrders = [];
  let filter = 'all';

  const loginScreen   = document.getElementById('login-screen');
  const dash          = document.getElementById('dashboard');
  const loginForm     = document.getElementById('login-form');
  const loginError    = document.getElementById('login-error');
  const ordersBox     = document.getElementById('orders-container');

  // ── Auto-restore session ──────────────────────────────────────────────
  if (token) { showDash(); loadOrders(); }

  // ── Login ─────────────────────────────────────────────────────────────
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const pw    = document.getElementById('login-password').value;
    if (!ALLOWED.includes(email)) { loginError.hidden = false; return; }
    loginError.hidden = true;
    const btn = loginForm.querySelector('button');
    btn.textContent = 'Signing in…';
    btn.disabled = true;
    try {
      const res = await apiFetch('?action=list', pw);
      if (res.status === 401) { loginError.hidden = false; return; }
      token = pw;
      sessionStorage.setItem('ck_admin', token);
      showDash();
      const data = await res.json();
      renderOrders(data);
    } finally {
      btn.textContent = 'Sign in';
      btn.disabled = false;
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    token = ''; sessionStorage.removeItem('ck_admin');
    dash.hidden = true; loginScreen.hidden = false;
  });

  // ── Load ──────────────────────────────────────────────────────────────
  async function loadOrders() {
    ordersBox.innerHTML = '<div class="state-msg">Loading orders…</div>';
    try {
      const res = await apiFetch('?action=list', token);
      if (res.status === 401) { token = ''; sessionStorage.removeItem('ck_admin'); return; }
      const data = await res.json();
      if (!Array.isArray(data)) {
        ordersBox.innerHTML = '<div class="state-msg">Error: ' + x(JSON.stringify(data)) + '</div>';
        return;
      }
      renderOrders(data);
    } catch (err) {
      ordersBox.innerHTML = '<div class="state-msg">Network error: ' + x(err.message) + '</div>';
    }
  }

  function apiFetch(qs, pw, opts = {}) {
    return fetch(API + qs, {
      ...opts,
      headers: { Authorization: 'Bearer ' + pw, 'Content-Type': 'application/json', ...(opts.headers || {}) }
    });
  }

  // ── Render ────────────────────────────────────────────────────────────
  function renderOrders(orders) {
    allOrders = orders;
    updateStats(orders);
    renderTable();
    document.getElementById('last-refresh').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-PK', { hour: '2-digit', minute: '2-digit' });
  }

  function updateStats(orders) {
    const shipped = orders.filter(o => o.shipped).length;
    document.getElementById('stat-total').textContent   = orders.length;
    document.getElementById('stat-pending').textContent = orders.length - shipped;
    document.getElementById('stat-shipped').textContent = shipped;
  }

  function renderTable() {
    const list = filter === 'shipped' ? allOrders.filter(o =>  o.shipped)
               : filter === 'pending' ? allOrders.filter(o => !o.shipped)
               : allOrders;

    if (!list.length) { ordersBox.innerHTML = '<div class="state-msg">No orders.</div>'; return; }

    ordersBox.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Date</th><th>Name</th><th>Phone</th><th>Address</th><th>City</th>
        <th>Items</th><th>Total</th><th>Ref. payment</th><th>Status</th><th>Label</th>
      </tr></thead>
      <tbody>${list.map(row).join('')}</tbody>
    </table></div>`;

    ordersBox.querySelectorAll('[data-ship]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const id = cb.dataset.ship;
        cb.disabled = true;
        await apiFetch('?action=ship', token, {
          method: 'POST',
          body: JSON.stringify({ id, shipped: cb.checked })
        });
        const o = allOrders.find(x => x.id === id);
        if (o) o.shipped = cb.checked;
        updateStats(allOrders);
        const tr = cb.closest('tr');
        tr.classList.toggle('is-shipped', cb.checked);
        const badge = tr.querySelector('.badge');
        badge.className = 'badge ' + (cb.checked ? 'badge-shipped' : 'badge-pending');
        badge.textContent = cb.checked ? 'Shipped' : 'Pending';
        cb.disabled = false;
      });
    });

    ordersBox.querySelectorAll('[data-print]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = allOrders.find(x => x.id === btn.dataset.print);
        if (o) printLabel(o);
      });
    });
  }

  function row(o) {
    const d    = o.data || {};
    const date = new Date(o.createdAt).toLocaleDateString('en-PK', { day:'2-digit', month:'short', year:'numeric' });
    const time = new Date(o.createdAt).toLocaleTimeString('en-PK', { hour:'2-digit', minute:'2-digit' });
    const cls  = o.shipped ? 'badge-shipped' : 'badge-pending';
    const lbl  = o.shipped ? 'Shipped' : 'Pending';
    return `<tr class="${o.shipped ? 'is-shipped' : ''}">
      <td class="date-cell">${date}<br>${time}</td>
      <td><strong>${x(d.name)}</strong></td>
      <td>${x(d.phone)}</td>
      <td>${x(d.address)}</td>
      <td>${x(d.city)}</td>
      <td class="items-cell">${x(d.order_items)}</td>
      <td class="total-cell">${x(d.order_total)}</td>
      <td>${x(d.payment_reference || '—')}</td>
      <td><label class="ship-toggle">
        <input type="checkbox" data-ship="${o.id}" ${o.shipped ? 'checked' : ''}>
        <span class="badge ${cls}">${lbl}</span>
      </label></td>
      <td><button class="btn-print" data-print="${o.id}">Print</button></td>
    </tr>`;
  }

  // ── Print label ───────────────────────────────────────────────────────
  function printLabel(o) {
    const d  = o.data || {};
    const id = 'CK-' + o.id.slice(-6).toUpperCase();
    const dt = new Date(o.createdAt).toLocaleDateString('en-PK', { day:'2-digit', month:'short', year:'numeric' });
    document.getElementById('print-frame').innerHTML = `
      <div style="width:10cm;min-height:6cm;border:2px solid #1A1814;padding:16px;font-family:Arial,sans-serif;font-size:12px;page-break-after:always">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:10px">
          <div>
            <div style="font-size:15px;font-weight:700;letter-spacing:2px">CHEF KNIFE</div>
            <div style="font-size:9px;color:#888;letter-spacing:1px;margin-top:2px">SIALKOT · PAKISTAN</div>
          </div>
          <div style="text-align:right;font-size:10px;color:#888;line-height:1.6">
            <div style="font-weight:600">${x(id)}</div>
            <div>${x(dt)}</div>
          </div>
        </div>
        <div style="margin-bottom:10px">
          <div style="font-size:9px;font-weight:700;letter-spacing:1px;color:#888;margin-bottom:6px">DELIVER TO</div>
          <div style="font-size:14px;font-weight:700;margin-bottom:2px">${x(d.name || '')}</div>
          <div style="font-weight:600;margin-bottom:2px">${x(d.phone || '')}</div>
          <div>${x(d.address || '')}</div>
          <div>${x(d.city || '')}${d.postal_code ? ' &ndash; ' + x(d.postal_code) : ''}</div>
        </div>
        <div style="border-top:1px solid #ccc;padding-top:8px;font-size:11px;color:#555">
          <div style="margin-bottom:2px">${x(d.order_items || '')}</div>
          <div style="font-weight:700">${x(d.order_total || '')}</div>
        </div>
      </div>`;
    window.print();
  }

  // ── Filter buttons ────────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      renderTable();
    });
  });

  document.getElementById('refresh-btn').addEventListener('click', loadOrders);

  // ── Helpers ───────────────────────────────────────────────────────────
  function showDash() { loginScreen.hidden = true; dash.hidden = false; }
  function x(s) {
    return String(s || '—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
