<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Chef Knife Orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1814;
      --ecru: #F4EFE5;
      --champagne: #B89968;
      --muted: #888;
      --border: #E0D8CC;
      --red: #c0392b;
    }
    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; font-size: 14px; background: var(--ecru); color: var(--ink); min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .login-card { background: #fff; border: 1px solid var(--border); padding: 48px 40px; width: 100%; max-width: 380px; }
    .login-title { font-size: 20px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
    .login-sub { color: var(--champagne); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 32px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .field input { border: 1px solid var(--border); padding: 10px 12px; font-family: inherit; font-size: 14px; color: var(--ink); outline: none; transition: border-color .2s; }
    .field input:focus { border-color: var(--champagne); }
    .btn-primary { width: 100%; padding: 12px; background: var(--ink); color: var(--ecru); border: none; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { background: #2d2a24; }
    .error-msg { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; }

    /* ── Dashboard ── */
    #dashboard { min-height: 100vh; }
    .admin-header { background: var(--ink); color: var(--ecru); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .admin-brand { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .admin-brand span { color: var(--champagne); }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .last-refresh { font-size: 11px; color: #777; }
    .btn-sm { padding: 6px 14px; background: transparent; border: 1px solid #444; color: #ccc; font-family: inherit; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
    .btn-sm:hover { border-color: #888; color: #fff; }
    .admin-main { padding: 24px; }

    /* Stats */
    .stats-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #fff; border: 1px solid var(--border); padding: 16px 20px; flex: 1; min-width: 110px; }
    .stat-value { font-size: 28px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--muted); }
    .filter-btn.active { background: var(--ink); color: var(--ecru); border-color: var(--ink); }
    .filter-btn:hover:not(.active) { border-color: var(--ink); color: var(--ink); }
    .search-input { padding: 6px 12px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 13px; width: 200px; outline: none; }
    .search-input:focus { border-color: var(--champagne); }
    .toolbar-right { margin-left: auto; display: flex; gap: 8px; }
    .btn-tool { padding: 6px 14px; border: 1px solid var(--border); background: #fff; font-family: inherit; font-size: 12px; cursor: pointer; }
    .btn-tool:hover { border-color: var(--champagne); color: var(--champagne); }

    /* Table */
    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f7f4ef; padding: 10px 14px; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #f0ede8; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #faf8f5; }
    tr.is-shipped td { opacity: .5; }
    .date-cell { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .items-cell { max-width: 180px; font-size: 12px; }
    .total-cell { font-weight: 600; white-space: nowrap; }
    .phone-link { color: inherit; text-decoration: none; }
    .phone-link:hover { color: var(--champagne); }
    .badge { display: inline-block; padding: 2px 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 2px; }
    .badge-pending { background: #FFF3CD; color: #856404; }
    .badge-shipped { background: #D1FAE5; color: #065F46; }
    .badge-spam    { background: #FEE2E2; color: #991B1B; }
    tr.is-spam td  { opacity: .6; }
    .ship-toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .ship-toggle input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--champagne); }
    .actions-cell { display: flex; gap: 6px; align-items: center; }
    .btn-print { padding: 5px 10px; background: transparent; border: 1px solid var(--champagne); color: var(--champagne); font-family: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
    .btn-print:hover { background: var(--champagne); color: #fff; }
    .btn-delete { padding: 5px 10px; background: transparent; border: 1px solid #ddd; color: #aaa; font-family: inherit; font-size: 11px; cursor: pointer; }
    .btn-delete:hover { border-color: var(--red); color: var(--red); }
    .state-msg { padding: 48px; text-align: center; color: var(--muted); }
    .ship-error { font-size: 10px; color: var(--red); margin-top: 3px; }

    /* ── Print ── */
    @media print {
      body > *:not(#print-frame) { display: none !important; }
      #print-frame { display: block !important; }
    }
    #print-frame { display: none; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <p class="login-title">Chef Knife</p>
    <p class="login-sub">Order Management</p>
    <form id="login-form">
      <label class="field"><span>Email</span><input type="email" id="login-email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input type="password" id="login-password" autocomplete="current-password" required></label>
      <button type="submit" class="btn-primary">Sign in</button>
      <p id="login-error" class="error-msg" hidden>Invalid credentials.</p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" hidden>
  <header class="admin-header">
    <span class="admin-brand">Chef Knife <span>/ Orders</span></span>
    <div class="header-right">
      <span class="last-refresh" id="last-refresh"></span>
      <button class="btn-sm" id="logout-btn">Sign out</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-pending">—</div><div class="stat-label">En attente</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-shipped">—</div><div class="stat-label">Expédiées</div></div>
    </div>

    <div class="toolbar">
      <button class="filter-btn active" data-filter="all">Toutes</button>
      <button class="filter-btn" data-filter="pending">En attente</button>
      <button class="filter-btn" data-filter="shipped">Expédiées</button>
      <input class="search-input" id="search-input" type="text" placeholder="Rechercher nom, ville…">
      <div class="toolbar-right">
        <button class="btn-tool" id="csv-btn">↓ CSV</button>
        <button class="btn-tool" id="refresh-btn">↻ Actualiser</button>
      </div>
    </div>

    <div id="orders-container"><div class="state-msg">Chargement…</div></div>
  </main>
</div>

<!-- PRINT FRAME -->
<div id="print-frame"></div>

<script>
(function () {
  'use strict';
  const API     = '/.netlify/functions/admin-orders';
  const ALLOWED = ['kazam.q@gmail.com', 'ayemenqureshi@gmail.com'];

  // localStorage → session survive les rechargements
  let token     = localStorage.getItem('ck_admin') || '';
  let allOrders = [];
  let filter    = 'all';
  let search    = '';

  const loginScreen = document.getElementById('login-screen');
  const dash        = document.getElementById('dashboard');
  const loginForm   = document.getElementById('login-form');
  const loginError  = document.getElementById('login-error');
  const ordersBox   = document.getElementById('orders-container');
  const searchInput = document.getElementById('search-input');

  if (token) { showDash(); loadOrders(); }

  // ── Login ─────────────────────────────────────────────────────────────
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const pw    = document.getElementById('login-password').value;
    if (!ALLOWED.includes(email)) { loginError.hidden = false; return; }
    loginError.hidden = true;
    const btn = loginForm.querySelector('button');
    btn.textContent = 'Connexion…'; btn.disabled = true;
    try {
      const res = await api('?action=list', pw);
      if (res.status === 401) { loginError.hidden = false; return; }
      const data = await res.json();
      if (!Array.isArray(data)) { loginError.hidden = false; return; }
      token = pw;
      localStorage.setItem('ck_admin', token);
      showDash();
      renderOrders(data);
    } catch { loginError.hidden = false; }
    finally { btn.textContent = 'Sign in'; btn.disabled = false; }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    token = ''; localStorage.removeItem('ck_admin');
    dash.hidden = true; loginScreen.hidden = false;
  });

  // ── Data ──────────────────────────────────────────────────────────────
  async function loadOrders() {
    ordersBox.innerHTML = '<div class="state-msg">Chargement…</div>';
    try {
      const res = await api('?action=list', token);
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      if (!Array.isArray(data)) {
        ordersBox.innerHTML = '<div class="state-msg">Erreur : ' + x(JSON.stringify(data)) + '</div>';
        return;
      }
      renderOrders(data);
    } catch (err) {
      ordersBox.innerHTML = '<div class="state-msg">Erreur réseau : ' + x(err.message) + '</div>';
    }
  }

  function api(qs, pw, opts = {}) {
    return fetch(API + qs, {
      ...opts,
      headers: { Authorization: 'Bearer ' + pw, 'Content-Type': 'application/json', ...(opts.headers||{}) }
    });
  }

  function logout() { token = ''; localStorage.removeItem('ck_admin'); location.reload(); }

  // ── Render ────────────────────────────────────────────────────────────
  function renderOrders(orders) {
    allOrders = orders;
    updateStats(orders);
    renderTable();
    document.getElementById('last-refresh').textContent =
      'Mis à jour ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    document.title = (() => {
      const n = orders.filter(o => !o.shipped).length;
      return n ? `(${n}) Admin — Chef Knife` : 'Admin — Chef Knife';
    })();
  }

  function updateStats(orders) {
    const shipped = orders.filter(o => o.shipped).length;
    document.getElementById('stat-total').textContent   = orders.length;
    document.getElementById('stat-pending').textContent = orders.length - shipped;
    document.getElementById('stat-shipped').textContent = shipped;
  }

  function getVisible() {
    return allOrders
      .filter(o => filter === 'all' ? true : filter === 'shipped' ? o.shipped : !o.shipped)
      .filter(o => {
        if (!search) return true;
        const q = search.toLowerCase();
        const d = o.data || {};
        return (d.name||'').toLowerCase().includes(q) || (d.city||'').toLowerCase().includes(q) || (d.phone||'').includes(q);
      });
  }

  function renderTable() {
    const list = getVisible();
    if (!list.length) { ordersBox.innerHTML = '<div class="state-msg">Aucune commande.</div>'; return; }

    ordersBox.innerHTML = `<div class="table-wrap"><table>
      <thead><tr>
        <th>Date</th><th>Nom</th><th>Téléphone</th><th>Adresse</th><th>Ville</th>
        <th>Articles</th><th>Total</th><th>Ref. paiement</th><th>Statut</th><th>Actions</th>
      </tr></thead>
      <tbody>${list.map(row).join('')}</tbody>
    </table></div>`;

    bindTableEvents();
  }

  function row(o) {
    const d   = o.data || {};
    const dt  = new Date(o.createdAt);
    const date = dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' });
    const time = dt.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    const cls  = o.spam ? 'badge-spam' : o.shipped ? 'badge-shipped' : 'badge-pending';
    const lbl  = o.spam ? '⚠ Spam' : o.shipped ? 'Expédiée' : 'En attente';
    const phone = d.phone ? `<a class="phone-link" href="tel:${x(d.phone)}">${x(d.phone)}</a>` : '—';
    return `<tr class="${o.spam ? 'is-spam' : o.shipped ? 'is-shipped' : ''}" data-id="${o.id}">
      <td class="date-cell">${date}<br>${time}</td>
      <td><strong>${x(d.name)}</strong></td>
      <td>${phone}</td>
      <td>${x(d.address)}</td>
      <td>${x(d.city)}</td>
      <td class="items-cell">${x(d.order_items)}</td>
      <td class="total-cell">${x(d.order_total)}</td>
      <td>${x(d.payment_reference || '—')}</td>
      <td>
        <label class="ship-toggle">
          <input type="checkbox" data-ship="${o.id}" ${o.shipped ? 'checked' : ''}>
          <span class="badge ${cls}">${lbl}</span>
        </label>
        <div class="ship-error" data-ship-error="${o.id}" hidden>Erreur sauvegarde</div>
      </td>
      <td class="actions-cell">
        <button class="btn-print" data-print="${o.id}">Étiquette</button>
        <button class="btn-delete" data-delete="${o.id}" title="Supprimer">✕</button>
      </td>
    </tr>`;
  }

  function bindTableEvents() {
    // Ship toggle
    ordersBox.querySelectorAll('[data-ship]').forEach(cb => {
      cb.addEventListener('change', async () => {
        const id      = cb.dataset.ship;
        const shipped = cb.checked;
        cb.disabled   = true;
        const errEl   = ordersBox.querySelector(`[data-ship-error="${id}"]`);
        try {
          const res  = await api('?action=ship', token, { method: 'POST', body: JSON.stringify({ id, shipped }) });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'Erreur');
          const o = allOrders.find(x => x.id === id);
          if (o) o.shipped = shipped;
          updateStats(allOrders);
          const tr = cb.closest('tr');
          tr.classList.toggle('is-shipped', shipped);
          const badge = tr.querySelector('.badge');
          badge.className = 'badge ' + (shipped ? 'badge-shipped' : 'badge-pending');
          badge.textContent = shipped ? 'Expédiée' : 'En attente';
          if (errEl) errEl.hidden = true;
        } catch {
          cb.checked = !shipped; // revert
          if (errEl) errEl.hidden = false;
        } finally { cb.disabled = false; }
      });
    });

    // Print
    ordersBox.querySelectorAll('[data-print]').forEach(btn => {
      btn.addEventListener('click', () => {
        const o = allOrders.find(x => x.id === btn.dataset.print);
        if (o) printLabel(o);
      });
    });

    // Delete
    ordersBox.querySelectorAll('[data-delete]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer cette commande définitivement ?')) return;
        const id = btn.dataset.delete;
        btn.disabled = true;
        try {
          await api('?action=delete', token, { method: 'POST', body: JSON.stringify({ id }) });
          allOrders = allOrders.filter(o => o.id !== id);
          updateStats(allOrders);
          renderTable();
        } catch { btn.disabled = false; alert('Erreur lors de la suppression.'); }
      });
    });
  }

  // ── Filters & Search ──────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      renderTable();
    });
  });

  searchInput.addEventListener('input', (e) => {
    search = e.target.value.trim();
    renderTable();
  });

  document.getElementById('refresh-btn').addEventListener('click', loadOrders);

  // ── CSV Export ────────────────────────────────────────────────────────
  document.getElementById('csv-btn').addEventListener('click', () => {
    const cols = ['Date','Nom','Téléphone','Email','Adresse','Ville','CP','Articles','Total','Ref. paiement','Statut'];
    const rows = allOrders.map(o => {
      const d = o.data || {};
      const dt = new Date(o.createdAt).toLocaleDateString('fr-FR');
      return [dt, d.name, d.phone, d.email, d.address, d.city, d.postal_code,
              d.order_items, d.order_total, d.payment_reference, o.shipped ? 'Expédiée' : 'En attente']
        .map(v => `"${(v||'').replace(/"/g,'""')}"`).join(',');
    });
    const csv  = [cols.join(','), ...rows].join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = 'commandes-chef-knife-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  });

  // ── Print label ───────────────────────────────────────────────────────
  function printLabel(o) {
    const d  = o.data || {};
    const id = 'CK-' + o.id.slice(-6).toUpperCase();
    document.getElementById('print-frame').innerHTML = `
      <div style="width:10cm;padding:20px;border:2px solid #1A1814;font-family:Arial,sans-serif;page-break-after:always">

        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #1A1814;padding-bottom:10px;margin-bottom:16px">
          <div style="font-size:15px;font-weight:700;letter-spacing:3px">CHEF KNIFE</div>
          <div style="font-size:9px;color:#888;text-align:right">${x(id)}<br>${new Date(o.createdAt).toLocaleDateString('fr-FR')}</div>
        </div>

        <!-- Recipient — large and prominent -->
        <div style="margin-bottom:16px">
          <div style="font-size:9px;font-weight:700;letter-spacing:1.5px;color:#888;margin-bottom:8px">DESTINATAIRE</div>
          <div style="font-size:18px;font-weight:700;margin-bottom:4px;line-height:1.2">${x(d.name || '')}</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:6px">${x(d.phone || '')}</div>
          <div style="font-size:14px;line-height:1.5">
            ${x(d.address || '')}<br>
            <strong>${x(d.city || '')}${d.postal_code ? ' ' + x(d.postal_code) : ''}</strong>
          </div>
        </div>

        <!-- Order details — small, no amounts -->
        <div style="border-top:1px solid #ccc;padding-top:10px;font-size:10px;color:#666;line-height:1.5">
          <div style="font-weight:700;letter-spacing:1px;margin-bottom:4px">COMMANDE</div>
          <div>${x((d.order_items || '').replace(/\s*-\s*PKR[\d,\s]+/g, '').replace(/\s*-\s*Rs[\d,\s]+/g, ''))}</div>
        </div>
      </div>`;
    window.print();
  }

  // ── Utils ─────────────────────────────────────────────────────────────
  function showDash() { loginScreen.hidden = true; dash.hidden = false; }
  function x(s) {
    return String(s || '—').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
