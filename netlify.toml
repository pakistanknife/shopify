[build]
  publish = "."

# ---------- Redirects ----------
# Redirect legacy product URLs (from earlier dev) to the SEO-friendly URLs
[[redirects]]
  from = "/product.html"
  query = { id = "sapphire" }
  to = "/chef-knife-set-sapphire.html"
  status = 301
  force = true

[[redirects]]
  from = "/product.html"
  query = { id = "olive" }
  to = "/chef-knife-set-olive.html"
  status = 301
  force = true

[[redirects]]
  from = "/product"
  to = "/#shop"
  status = 301

# Pretty short URLs (optional shortcuts)
[[redirects]]
  from = "/sapphire"
  to = "/chef-knife-set-sapphire.html"
  status = 301

[[redirects]]
  from = "/olive"
  to = "/chef-knife-set-olive.html"
  status = 301

# ---------- Headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Serve sitemap with correct content type
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
