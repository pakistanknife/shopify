name: Deploy to OVH

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git log dates

      - name: Update sitemap lastmod dates
        run: python3 update-sitemap.py

      - name: Deploy via FTP to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:        ${{ secrets.FTP_SERVER }}
          username:      ${{ secrets.FTP_USERNAME }}
          password:      ${{ secrets.FTP_PASSWORD }}
          server-dir:    /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            secrets.php
            data/orders.json

      - name: Ping Google sitemap
        run: curl -s "https://www.google.com/ping?sitemap=https://chef-knife.pk/sitemap.xml" -o /dev/null -w "%{http_code}"

      - name: IndexNow — notify Bing/Yandex/others
        run: |
          python3 - <<'EOF'
          import re, json, urllib.request

          KEY = "85547937fa064dd6854811d0a1076e3c"
          HOST = "chef-knife.pk"

          sitemap = open("sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>(.*?)</loc>", sitemap)

          payload = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"}
          )
          with urllib.request.urlopen(req) as r:
              print(f"IndexNow: {r.status} — {len(urls)} URLs submitted")
          EOF
